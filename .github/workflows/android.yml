name: Android test candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PUB_CACHE: ${{ github.workspace }}/.tools/pub-cache
      GRADLE_USER_HOME: ${{ github.workspace }}/.tools/gradle
      SMS_ALERT_TEST_SIGNING: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          python3 tools/install_flutter.py
          echo "$PWD/.tools/flutter/bin" >> "$GITHUB_PATH"
          .tools/flutter/bin/flutter config --no-analytics
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1'
          python3 tools/install_ndk.py
      - name: Dart checks
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Native checks
        working-directory: app/android
        run: ./gradlew testDebugUnitTest lintRelease
      - name: Explicit CI test signing, release-mode APK
        working-directory: app
        run: flutter build apk --release
      - name: Audit packaged release
        run: |
          python3 tools/check_apk.py app/build/app/outputs/flutter-apk/app-release.apk --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/app/outputs/flutter-apk/app-release.apk
          sha256sum app/build/app/outputs/flutter-apk/app-release.apk > app/build/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sms-alert-ci-test-apk
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/SHA256SUMS
            app/build/app/reports/
          retention-days: 14
